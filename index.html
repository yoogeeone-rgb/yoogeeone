viewer=document.getElementById('viewer'),pictures=[...document.querySelectorAll('.portfolio-photo')].sort((a,b)=>Number(a.dataset.index)-Number(b.dataset.index));const home=document.getElementById('home'),contact=document.getElementById('contact'),details=document.getElementById('details');function pageDistance(){return innerHeight*(matchMedia('(max-width:600px)').matches?1:0.6)}function move(n){window.scrollTo({top:Math.max(0,Math.min(pageCount-1,n))*pageDistance(),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}function mark(isContact){home.removeAttribute('aria-current');contact.removeAttribute('aria-current');(isContact?contact:home).setAttribute('aria-current','page');contact.setAttribute('aria-expanded',String(isContact))}function update(){const distance=pageDistance();document.documentElement.style.setProperty('--scroll-step',distance+'px');document.documentElement.style.setProperty('--view-height',innerHeight+'px');current=Math.min(pageCount-1,Math.max(0,Math.floor((scrollY+distance/2)/distance)));grid.style.setProperty('--page',current);document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+String(pageCount).padStart(2,'0');document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pageCount-1;tiles.forEach((b,i)=>{const n=current*9+i,exists=n<works.length;b.disabled=!exists;b.dataset.empty=String(!exists);b.querySelector('.caption').textContent=exists?works[n].title:'';b.setAttribute('aria-label',exists?works[n].title+' 크게 보기':'빈 칸')})}function renderViewer(){document.getElementById('large').src=pictures[viewerIndex].src;document.getElementById('viewer-title').textContent=works[viewerIndex].title;document.getElementById('viewer-count').textContent=String(viewerIndex+1).padStart(2,'0')+' / '+works.length}tiles.forEach((b,i)=>b.onclick=()=>{const n=current*9+i;if(n>=works.length)return;viewerIndex=n;renderViewer();viewer.showModal();document.body.style.overflow='hidden'});function step(d){viewerIndex=(viewerIndex+d+works.length)%works.length;renderViewer()}document.getElementById('viewer-prev').onclick=e=>{e.stopPropagation();step(-1)};document.getElementById('viewer-next').onclick=e=>{e.stopPropagation();step(1)};document.getElementById('close').onclick=()=>viewer.close();viewer.onclick=e=>{if(e.target===viewer||e.target.id==='large')viewer.close()};viewer.addEventListener('close',()=>document.body.style.overflow='');addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});let touchX=0;viewer.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});viewer.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>45){e.preventDefault();step(delta<0?1:-1)}},{passive:false});document.getElementById('prev').onclick=()=>move(current-1);document.getElementById('next').onclick=()=>move(current+1);home.onclick=()=>{move(0);details.hidden=true;mark(false)};contact.onclick=()=>{details.hidden=!details.hidden;mark(!details.hidden)};document.querySelector('.wordmark').onclick=e=>{e.preventDefault();move(0);details.hidden=true;mark(false)};addEventListener('scroll',update,{passive:true});addEventListener('resize',update);mark(false);update();</script></html>
