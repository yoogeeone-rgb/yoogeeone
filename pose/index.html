<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>포즈 가이드 | YOOGEEONE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #111; background: #fff; font: 1rem/1.6 system-ui, -apple-system, sans-serif; }
    main { width: min(100%, 420px); margin: 0 auto; padding: clamp(48px, 16vh, 140px) 24px 32px; }
    img { display: block; width: min(100%, 250px); height: auto; }
    h1 { margin: 36px 0 20px; font-size: clamp(1.9rem, 7vw, 2.5rem); letter-spacing: -.06em; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input, button { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #111; border-radius: 0; font: inherit; }
    input { color: inherit; background: #fff; }
    button { margin-top: 12px; color: #fff; background: #111; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 2px solid #111; outline-offset: 3px; }
    #status { color: #444; }
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="YOOGEEONE 홈페이지"><img src="assets/wordmark.png" width="782" height="167" alt="YOOGEEONE"></a>
    <h1>포즈 가이드</h1>
    <form id="unlockForm" method="post">
      <label for="password">관리자 암호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" disabled>열기</button>
      <p id="status" role="status"></p>
    </form>
    <noscript><p>가이드를 열려면 브라우저에서 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <script>
    'use strict';
    const form = document.getElementById('unlockForm');
    const password = document.getElementById('password');
    const submit = form.querySelector('button');
    const status = document.getElementById('status');
    const saltLength = 16;
    const ivLength = 12;
    const headerLength = saltLength + ivLength;
    let sealedGuide;

    async function loadGuide() {
      const response = await fetch('guide.enc', { cache: 'no-cache' });
      if (!response.ok) throw new Error('Guide download failed');
      const bytes = new Uint8Array(await response.arrayBuffer());
      if (bytes.length <= headerLength + 16) throw new Error('Guide payload is incomplete');
      return bytes;
    }

    async function decryptGuide(secret, bytes) {
      const passwordKey = await crypto.subtle.importKey('raw', secret, 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({
        name: 'PBKDF2', salt: bytes.subarray(0, saltLength), iterations: 600000, hash: 'SHA-256'
      }, passwordKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      return crypto.subtle.decrypt({
        name: 'AES-GCM', iv: bytes.subarray(saltLength, headerLength), tagLength: 128
      }, key, bytes.subarray(headerLength));
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      const secret = new TextEncoder().encode(password.value);
      password.value = '';
      status.textContent = '가이드를 여는 중입니다.';
      try {
        sealedGuide ??= await loadGuide();
        const decrypted = await decryptGuide(secret, sealedGuide);
        const stream = new Blob([decrypted]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        // Render only after the encrypted guide has passed authentication.
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = error.name === 'OperationError'
          ? '암호가 맞지 않습니다. 다시 입력해 주세요.'
          : '가이드를 불러오지 못했습니다. 다시 시도해 주세요.';
        submit.disabled = false;
        password.focus();
      } finally {
        secret.fill(0);
      }
    });

    if (globalThis.crypto?.subtle && 'DecompressionStream' in globalThis) {
      submit.disabled = false;
    } else {
      status.textContent = '최신 브라우저에서 HTTPS로 접속해 주세요.';
    }
  </script>
</body>
</html>
